name: Refresh IPC mirror

on:
  schedule:
    - cron: "37 3 * * *" # daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install --no-sources -e .
      - name: Refresh IPC/CH mirror (HDX + HAPI + IPC API)
        env:
          DSCI_AZ_DB_DEV_HOST: ${{ secrets.DSCI_AZ_DB_DEV_HOST }}
          DSCI_AZ_DB_DEV_UID_WRITE: ${{ secrets.DSCI_AZ_DB_DEV_UID_WRITE }}
          DSCI_AZ_DB_DEV_PW_WRITE: ${{ secrets.DSCI_AZ_DB_DEV_PW_WRITE }}
          HAPI_APP_IDENTIFIER: ${{ secrets.HAPI_APP_IDENTIFIER }}
          IPC_AUTH: ${{ secrets.IPC_AUTH }}
          PGSSLMODE: require
        run: uv run --no-sync python scripts/refresh_ipc.py
