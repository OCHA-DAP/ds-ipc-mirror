[project]
name = "ds-ipc-mirror"
version = "0.1.0"
description = "Mirror of IPC/Cadre Harmonisé acute food insecurity classifications (HDX + HAPI + IPC API)"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pandas",
    "pyarrow",
    "python-dotenv",
    "ocha-stratus>=0.1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
